<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nick van der Klein - Freelance Marketing (Brand, Strategy & Communication) Researcher</title>
    <style>
        /* Algemene stijlen */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.6;
            background-color: #f1e6fa;
            color: #333;
        }

        header {
            background: #333;
            color: #fff;
            padding: 1rem 0;
            transition: background 0.3s ease;
        }

        header ul {
            list-style: none;
            text-align: center;
            margin: 0;
            padding: 0;
        }

        header ul li {
            display: inline;
            margin: 0 15px;
        }

        header ul li a {
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.3s ease;
        }

        header ul li a:hover {
            color: #f1c40f;
        }

        /* Hero sectie */
        .hero {
            text-align: center;
            padding: 3rem 1rem;
            background: #f4f4f4;
        }

        .hero h1 {
            font-size: 2.5rem;
            color: #333;
        }

        .hero p {
            font-size: 1.2rem;
            color: #666;
        }

        .cta-button {
            display: inline-block;
            background-color: #f1c40f;
            color: #333;
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 5px;
            text-decoration: none;
            margin-top: 2rem;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }

        .cta-button:hover {
            background-color: #e1b10f;
            transform: translateY(-3px);
        }

        /* Secties */
        section {
            padding: 2rem;
            margin: 2rem auto;
            max-width: 900px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h2 {
            color: #333;
            text-align: center;
            margin-bottom: 1rem;
            font-size: 2rem;
        }

        /* Carrousel-stijl */
        .carousel {
            position: relative;
            max-width: 100%;
            margin: auto;
            overflow: hidden;
            border-radius: 8px;
        }

        .carousel-images {
            display: flex;
            transition: transform 0.5s ease-in-out;
        }

        .carousel-images img {
            max-width: 100%;
            flex-shrink: 0;
        }

        .carousel-button {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            border: none;
            padding: 10px;
            cursor: pointer;
        }

        .carousel-button.prev {
            left: 10px;
        }

        .carousel-button.next {
            right: 10px;
        }
    </style>
</head>
<body>
    <!-- Navigatie -->
    <header>
        <nav>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#mijn-strategie">Mijn Strategie</a></li>
                <li><a href="#mijn-werk">Mijn Werk</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Homepagina -->
    <section id="home" class="hero">
        <h1>Nick van der Klein</h1>
        <p>Freelance Brand Researcher</p>
        <a href="#contact" class="cta-button">Neem Direct Contact Op</a>
    </section>

    <!-- Mijn Strategie -->
    <section id="mijn-strategie">
        <h2>Mijn Strategie</h2>
        <div class="carousel">
            <div class="carousel-images">
                <img src="image1.jpg" alt="Strategie afbeelding 1">
                <img src="image2.jpg" alt="Strategie afbeelding 2">
                <img src="image3.jpg" alt="Strategie afbeelding 3">
            </div>
            <button class="carousel-button prev">&#10094;</button>
            <button class="carousel-button next">&#10095;</button>
        </div>
    </section>

    <!-- Mijn werk -->
    <section id="mijn-werk">
        <h2>Mijn Werk</h2>
        <p>Artikelen en projecten...</p>
    </section>

    <footer>
        <p>&copy; 2024 Nick van der Klein</p>
    </footer>

    <script>
        const carouselImages = document.querySelector('.carousel-images');
        const images = document.querySelectorAll('.carousel-images img');
        const prevButton = document.querySelector('.carousel-button.prev');
        const nextButton = document.querySelector('.carousel-button.next');

        let index = 0;

        function showImage(i) {
            const offset = -i * 100;
            carouselImages.style.transform = `translateX(${offset}%)`;
        }

        prevButton.addEventListener('click', () => {
            index = (index > 0) ? index - 1 : images.length - 1;
            showImage(index);
        });

        nextButton.addEventListener('click', () => {
            index = (index < images.length - 1) ? index + 1 : 0;
            showImage(index);
        });
    </script>
</body>
</html>
