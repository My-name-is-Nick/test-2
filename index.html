<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Example</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }

        .text-section {
            flex: 1;
            padding-right: 20px;
        }

        .text-section h1 {
            font-size: 2.5rem;
            color: #333;
        }

        .text-section p {
            font-size: 1.2rem;
            color: #555;
            line-height: 1.5;
        }

        .image-section {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .image-section img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="text-section">
            <h1>Welcome to Our Website</h1>
            <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Duis sollicitudin leo et lectus bibendum, ac efficitur eros feugiat. Fusce a nisl sit amet sapien suscipit dignissim. Integer at erat nec lorem vehicula pulvinar ut non justo.</p>
        </div>
        <div class="image-section">
            <img src="example-image.jpg" alt="Example Image">
        </div>
    </div>
</body>
</html>
